services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vetclinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - vetclinic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vetclinic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vetclinic-postgres-data:
