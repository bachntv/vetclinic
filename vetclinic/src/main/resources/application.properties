spring.application.name=vetclinic
spring.profiles.default=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.jwt.secret=${JWT_SECRET:local-development-secret-key-change-before-deployment-123456}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
